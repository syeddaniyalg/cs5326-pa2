run_dir: outputs/dpo_hh
sft_checkpoint: outputs/sft/best
train_path: data/processed/hh_train.jsonl
val_path: data/processed/hh_val.jsonl
train_size: 15000
val_size: 1000
max_length: 512
max_prompt_length: 256
per_device_batch_size: 1
eval_batch_size: 4
gradient_accumulation_steps: 32
optimizer: adamw
learning_rate: 1.0e-06
warmup_ratio: 0.0
lr_scheduler: constant
weight_decay: 0.0
max_grad_norm: 1.0
beta: 0.1
epochs: 1
seed: 42
policy_device: cuda:0
reference_device: cuda:1
gradient_checkpointing: false
log_every_steps: 1
eval_every_steps: 50
eval_at_start: true
save_dtype: float16
num_workers: 2
